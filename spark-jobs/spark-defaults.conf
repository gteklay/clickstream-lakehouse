# ==============================================================================
#  CORE PRODUCTION SPARK ARCHITECTURE DEFAULTS
# ==============================================================================
spark.master                                    spark://spark-master:7077
spark.app.name                                  ClickstreamRealTimeLakehouse
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ️ POSTGRESQL ICEBERG JDBC catalog-db MAPPINGS
spark.sql.catalog.local_lakehouse               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local_lakehouse.catalog-impl  org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.local_lakehouse.catalog-type  jdbc
spark.sql.catalog.local_lakehouse.uri           jdbc:postgresql://catalog-db:5432/iceberg_catalog
spark.sql.catalog.local_lakehouse.jdbc.user     catalog_admin
spark.sql.catalog.local_lakehouse.jdbc.password super_secret_catalog_password_123
spark.hadoop.fs.defaultFS                       file:///
spark.sql.catalog.local_lakehouse.warehouse    file:///opt/spark/warehouse
spark.sql.defaultCatalog                        local_lakehouse
spark.sql.ansi.enabled                              false
spark.sql.adaptive.enabled                      false
