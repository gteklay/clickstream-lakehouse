connector.name=iceberg
iceberg.catalog.type=jdbc

# ️ CORE JDBC LEDGER MATRIX (PostgreSQL)
# Configures Trino to read your Iceberg metadata pointers straight from the Postgres ledger container
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://catalog-db:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=catalog_admin
iceberg.jdbc-catalog.connection-password=super_secret_catalog_password_123
iceberg.jdbc-catalog.catalog-name=local_lakehouse
iceberg.jdbc-catalog.default-warehouse-dir=file:///opt/spark/warehouse

fs.hadoop.enabled=true
#iceberg.metadata-cache.enabled=false
#fs.cache.enabled=false
# Authorizes Trino to allow manual and system-level table index registrations
#iceberg.register-table-procedure.enabled=true
